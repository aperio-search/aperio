[package]
name = "aperio"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = { version = "0.8.16", features = ["alloc", "bytecheck"] }
heed = "0.22.1"
roaring = "0.11.4"
toml = "1.1.2"
charabia = "0.9.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
tikv-jemallocator = "0.7"
rayon = "1.12"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
tower = "0.5"
http-body-util = "0.1"
