[package]
name = "aster"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
fjall = "3.1.4"
roaring = { version = "0.11.4", features = ["serde"] }
unicode-normalization = "0.1"
