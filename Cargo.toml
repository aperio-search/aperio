[package]
name = "aster"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = { version = "0.8.16", features = ["alloc", "bytecheck"] }
fjall = "3.1.4"
roaring = { version = "0.11.4", features = ["serde"] }
toml = "1.1.2"
unicode-normalization = "0.1"
