name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - docs/**
  pull_request:
    branches: [main]
    paths:
      - docs/**

defaults:
  run:
    working-directory: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run docs:build
